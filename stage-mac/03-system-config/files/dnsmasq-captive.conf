# Captive-portal DNS for the "RPi-Mac Setup" access point.
#
# NetworkManager starts a dedicated dnsmasq for every ipv4.method=shared
# connection (only the setup hotspot uses it here) and includes this file.
# Resolving every name to the AP gateway makes a joining phone/laptop send
# its connectivity-check probe to our web UI, which then redirects the
# browser to the setup page - so the user never has to type 10.42.0.1.
#
# This has no effect when the Pi is a normal WiFi client (that path does not
# use the shared-mode dnsmasq).
address=/#/10.42.0.1
