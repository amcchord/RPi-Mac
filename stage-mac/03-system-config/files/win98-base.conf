# DOSBox-X base configuration for RPi-Mac Windows mode.
#
# rpimac-dosbox appends an [autoexec] section that mounts the installed
# Windows 98 hard disk and boots it. Rendering is fullscreen via OpenGL,
# which is the only output that works under SDL's KMSDRM video driver
# (output=surface has no window framebuffer there). The patched DOSBox-X
# mirrors the OpenGL framebuffer to /dev/shm/win98-screen for the web
# console.
[sdl]
autolock=false
fullscreen=true
output=opengl
mouse_emulation=never

[dosbox]
title=Windows 98
memsize=128

[video]
vmemsize=8
vesa modelist width limit=0
vesa modelist height limit=0

[dos]
ver=7.1
hard drive data rate limit=0
floppy drive data rate limit=0

[cpu]
cputype=pentium_mmx
core=normal

# Windows 98 still detects a Sound Blaster 16 (so its driver loads cleanly),
# but host audio output is disabled. Without this, once Windows reaches the
# desktop a broken/absent host ALSA sink underruns in a tight loop and floods
# the journal at hundreds of MB/s (it would fill the disk and starve the CPU).
# Leave audio off until a robust per-host ALSA sink story exists.
[mixer]
nosound=true

[sblaster]
sbtype=sb16vibra

# No soundfont is shipped, so keep MIDI off; this also avoids DOSBox-X
# probing PulseAudio/FluidSynth backends at startup.
[midi]
mididevice=none

[fdc, primary]
int13fakev86io=true

[ide, primary]
int13fakeio=true
int13fakev86io=true

[ide, secondary]
int13fakeio=true
int13fakev86io=true
cd-rom insertion delay=4000

[render]
scaler=none
