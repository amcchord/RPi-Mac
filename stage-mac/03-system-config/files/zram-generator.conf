[zram0]
# Scale with installed RAM instead of a fixed 256 MB: ~half of RAM, capped at
# 1 GB. On the 512 MB Pi Zero 2 W this is ~234 MB (close to the old fixed
# value); on the 1-8 GB Pi 4/5 and Orange Pi boards it grows up to the cap.
# systemd-zram-generator evaluates this expression at boot (ram = total MB).
zram-size = min(ram / 2, 1024)
compression-algorithm = zstd
swap-priority = 100
