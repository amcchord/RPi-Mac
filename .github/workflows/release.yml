name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SD card image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet || true
          sudo mkdir -p /mnt/pigen-work
          df -h /

      - name: Build image
        env:
          WORK_DIR: /mnt/pigen-work
        run: |
          sudo -E ./scripts/build.sh
          ls -lh deploy/

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rpimac-image
          path: deploy/*.img.xz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" deploy/*.img.xz \
            --title "RPi-Mac ${GITHUB_REF_NAME}" \
            --notes "Flash the .img.xz to an SD card (8 GB+) with Raspberry Pi Imager or balenaEtcher, optionally edit mac.txt on the boot partition for WiFi, then boot a Pi Zero 2 W. Web UI at http://rpimac.local/ (SSH: mac / rpimac)."
